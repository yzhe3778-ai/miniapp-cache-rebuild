name: Bug report
description: Report a failure using a minimal synthetic or sanitized example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach passwords, tokens, commercial packages, decompiled code, or private assets. Use generated samples and sanitized logs."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node/tool versions; WeChat version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command with private paths/identifiers replaced and synthetic sample construction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include sanitized structured errors and scope; do not paste API responses with credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this issue contains no credentials or third-party private material.
          required: true
