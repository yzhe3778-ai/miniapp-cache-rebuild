name: Synthetic checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python scripts/cache_tool.py doctor
      - run: python scripts/test_cache_tool.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - run: python scripts/package_skill.py --root . --out ../miniapp-cache-rebuild.zip

# Only generated synthetic fixtures are used. Real commercial packages are opt-in local checks.
